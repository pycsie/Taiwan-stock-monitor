name: Stock MA Auto Notifier

on:
  schedule:
    # UTC 時間：週一至週五 01:00 ~ 05:30 (對應台灣時間 09:00 ~ 13:30，每 30 分鐘執行一次)
    - cron: '0,30 1-5 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上進行手動測試觸發

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests gspread

      - name: Run Auto Notifier
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          SPREADSHEET_KEY: ${{ secrets.SPREADSHEET_KEY }}
        run: python auto_notifier.py
